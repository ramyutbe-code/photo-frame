<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Photo Frame</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #080808; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
    #stage { position: fixed; inset: 0; display: grid; place-items: center; }
    #photo { width: 100%; height: 100%; object-fit: contain; opacity: 1; transition: opacity 700ms ease; }
    #photo.fade { opacity: 0; }
    #shade { position: fixed; inset: auto 0 0; padding: 3rem 1.25rem 1.25rem; background: linear-gradient(transparent, rgba(0,0,0,.75)); display: flex; align-items: end; justify-content: space-between; gap: 1rem; opacity: 1; transition: opacity .35s; }
    #shade.hidden { opacity: 0; pointer-events: none; }
    #caption { font-size: clamp(.8rem, 2vw, 1rem); color: #ddd; }
    #controls { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: end; }
    button, select { border: 1px solid #777; background: rgba(25,25,25,.9); color: white; border-radius: .55rem; padding: .65rem .8rem; font: inherit; cursor: pointer; }
    #hint { position: fixed; top: 1rem; left: 1rem; padding: .5rem .75rem; border-radius: .5rem; background: rgba(0,0,0,.55); color: #ddd; font-size: .85rem; opacity: 1; transition: opacity .35s; }
    #hint.hidden { opacity: 0; }
    #error { max-width: 44rem; padding: 2rem; line-height: 1.5; text-align: center; }
    #error code { color: #9ee7ff; }
    @media (max-width: 600px) { #shade { flex-direction: column; align-items: stretch; } #controls { justify-content: center; } }
    @media (prefers-reduced-motion: reduce) { #photo, #shade, #hint { transition: none; } }
  </style>
</head>
<body>
  <main id="stage"><img id="photo" alt="Slideshow photo" /></main>
  <div id="hint">Tap / move mouse to show controls · F fullscreen · Space pause</div>
  <footer id="shade">
    <div id="caption">Loading photos…</div>
    <div id="controls">
      <button id="prev" aria-label="Previous photo">← Previous</button>
      <button id="toggle">Pause</button>
      <button id="next" aria-label="Next photo">Next →</button>
      <button id="shuffle">Shuffle: Off</button>
      <label style="display:flex;align-items:center;gap:.4rem">Every
        <select id="interval" aria-label="Slide duration">
          <option value="5">5 sec</option><option value="10" selected>10 sec</option>
          <option value="15">15 sec</option><option value="30">30 sec</option>
        </select>
      </label>
      <button id="full">Fullscreen</button>
    </div>
  </footer>
<script>
/*
  Add direct image URLs below. Use the direct image URL from ImgBB, typically
  starting with https://i.ibb.co/ . Do not use the ImgBB page/share URL.
  This is a public website: anyone who can access it may see these URLs/photos.
*/
const PHOTOS = [
  // "https://i.ibb.co/your-image-id/your-photo.jpg",
];

const img = document.getElementById('photo');
const caption = document.getElementById('caption');
const shade = document.getElementById('shade');
const hint = document.getElementById('hint');
const toggleBtn = document.getElementById('toggle');
const shuffleBtn = document.getElementById('shuffle');
const intervalSelect = document.getElementById('interval');

let order = PHOTOS.map((_, i) => i);
let position = 0;
let playing = true;
let shuffled = false;
let timer = null;
let hideTimer = null;
let touchStartX = null;

function shuffleOrder() {
  order = PHOTOS.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  position = 0;
}
function showControls() {
  shade.classList.remove('hidden');
  hint.classList.remove('hidden');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    shade.classList.add('hidden');
    hint.classList.add('hidden');
  }, 3500);
}
function showPhoto(nextPosition) {
  if (!PHOTOS.length) {
    caption.innerHTML = 'No photos added yet. Edit <code>index.html</code> and add direct ImgBB image URLs to the <code>PHOTOS</code> list.';
    img.style.display = 'none';
    return;
  }
  position = (nextPosition + order.length) % order.length;
  const url = PHOTOS[order[position]];
  img.classList.add('fade');
  const preload = new Image();
  preload.onload = () => {
    setTimeout(() => {
      img.src = url;
      img.alt = `Photo ${position + 1} of ${order.length}`;
      img.classList.remove('fade');
      caption.textContent = `${position + 1} / ${order.length}`;
    }, 180);
  };
  preload.onerror = () => {
    caption.textContent = `Could not load photo ${position + 1}. Check that the URL is a direct image link.`;
    img.classList.remove('fade');
  };
  preload.src = url;
}
function stopTimer() { clearInterval(timer); timer = null; }
function startTimer() {
  stopTimer();
  if (playing && PHOTOS.length > 1) timer = setInterval(() => showPhoto(position + 1), Number(intervalSelect.value) * 1000);
}
function setPlaying(value) {
  playing = value;
  toggleBtn.textContent = playing ? 'Pause' : 'Play';
  startTimer();
}
document.getElementById('prev').addEventListener('click', () => { showPhoto(position - 1); showControls(); });
document.getElementById('next').addEventListener('click', () => { showPhoto(position + 1); showControls(); });
toggleBtn.addEventListener('click', () => { setPlaying(!playing); showControls(); });
shuffleBtn.addEventListener('click', () => {
  shuffled = !shuffled;
  shuffleBtn.textContent = `Shuffle: ${shuffled ? 'On' : 'Off'}`;
  if (shuffled) shuffleOrder(); else { order = PHOTOS.map((_, i) => i); position = 0; }
  showPhoto(position); startTimer(); showControls();
});
intervalSelect.addEventListener('change', () => { startTimer(); showControls(); });
document.getElementById('full').addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) { caption.textContent = 'Use your browser menu to enter fullscreen on this device.'; }
  showControls();
});
document.addEventListener('mousemove', showControls);
document.addEventListener('pointerdown', showControls);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') showPhoto(position + 1);
  else if (e.key === 'ArrowLeft') showPhoto(position - 1);
  else if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key.toLowerCase() === 'f') document.getElementById('full').click();
  showControls();
});
document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const delta = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(delta) > 55) showPhoto(position + (delta < 0 ? 1 : -1));
  touchStartX = null;
}, {passive:true});

if (shuffled) shuffleOrder();
showPhoto(0);
startTimer();
showControls();
</script>
</body>
</html>
